name: Save Docker image
description: Save a local Docker image to a tar archive without contacting a registry.

inputs:
  image:
    description: Fully qualified local image reference, including its tag.
    required: true
  tarball:
    description: Output path for the Docker image tar archive.
    required: true
  additional-images:
    description: Optional newline-delimited image references to include in the same archive.
    required: false
    default: ''

outputs:
  tarball:
    description: The saved Docker image tar archive path.
    value: ${{ steps.save.outputs.tarball }}

runs:
  using: composite
  steps:
    - id: save
      name: Save image archive
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        TARBALL: ${{ inputs.tarball }}
        ADDITIONAL_IMAGES: ${{ inputs.additional-images }}
      run: |
        set -euo pipefail

        test -n "$IMAGE"
        test -n "$TARBALL"

        images=("$IMAGE")
        while IFS= read -r additional_image; do
          if [[ -n "$additional_image" ]]; then
            images+=("$additional_image")
          fi
        done <<< "$ADDITIONAL_IMAGES"

        for image in "${images[@]}"; do
          docker image inspect "$image" >/dev/null
        done

        mkdir -p "$(dirname -- "$TARBALL")"
        docker image save --output "$TARBALL" "${images[@]}"
        test -s "$TARBALL"

        printf 'tarball=%s\n' "$TARBALL" >> "$GITHUB_OUTPUT"
